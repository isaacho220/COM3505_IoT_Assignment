; PlatformIO configuration for the ESP32-S3 Feather firmware.
; This file tells PlatformIO which board, framework and libraries to use when
; building and uploading src/main.cpp.

[env:adafruit_feather_esp32s3]
; Espressif ESP32 platform support.
platform = espressif32

; Target board used in this coursework.
board = adafruit_feather_esp32s3

; Use the Arduino framework because the firmware is written as an Arduino-style
; setup() and loop() program.
framework = arduino

; Serial monitor speed. Open the PlatformIO monitor at this baud rate to view
; debug messages such as WiFi connection status and sensor readings.
monitor_speed = 115200

; ArduinoJson is used to create sensor JSON payloads and parse pattern JSON
; responses from the Flask server.
lib_deps =
    bblanchon/ArduinoJson@^7.0.4